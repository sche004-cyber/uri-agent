# Reusable components — none formally adopted yet. Candidate mappings only;
# not binding by this normalization alone.
#
# Status vocabulary (Phase C): NOT_STARTED, EXPERIMENTAL,
# QUALIFIED_WITH_LIMITATIONS, INTEGRATED, DISTRIBUTABLE. No component may use
# a stronger status than evidence supports.
#
# Cross-agent portability rule (Phase C): a component must not be classified
# agent-neutral, generally reusable, portable, or DISTRIBUTABLE solely
# because its interface appears clean. General portability requires
# successful validation through at least one non-URI agent or harness
# adapter (cross_agent_portable: true, with portability_validated_via
# naming that adapter/harness). URI-internal compatibility alone
# (cross_agent_portable: false, portability_validated_via: null) is not
# proof of agent portability and never justifies DISTRIBUTABLE by itself.
# ---------------------------------------------------------------------------
