architecture_decisions:
  - id: "D1"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "gmail_create_draft wrong_binding_impact = RECOVERABLE (an unsent draft is correctable before external communication). Independent of EffectType, ApprovalRequirement, RiskLevel. A future real send action is expected to be CONSEQUENTIAL. wrong_binding_impact is never derived mechanically from EffectType."
  - id: "D2"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "Keep EDGE_ONLY, HYBRID, MAIN_BRAIN_PREFERRED. intelligence_mode, AUTO vs explicit model selection, and Edge ON/OFF are independent dimensions. HYBRID is efficiency-first; MAIN_BRAIN_PREFERRED is capability-first; not merged. An explicitly selected model is the Capable Brain for substantive work with native capabilities preserved; qualified supporting Edge work stays permitted. Edge OFF removes Edge inference only. EDGE_ONLY never silently calls the Capable Brain."
    recorded_in: "docs/architecture/M33_2_EDGE_SECOND_BRAIN_CANONICAL_ARCHITECTURE.md amendment G2"
  - id: "D3"
    date: "2026-09-26"
    status: "DECIDED"
    decision: "Qualified Edge or Capable models may investigate, interpret clues, compare, narrow, annotate, and return structured grounded evidence, but never create binding authority. Model preference alone never creates TENTATIVE. The flow is model evidence, then a deterministic resolution/eligibility check, then TENTATIVE / CONFIRMED / CLARIFY. Models never invent candidate IDs."
  - id: "D4"
    date: "2026-09-26"
    status: "DEFERRED"
    decision: "Durable cross-session learned reference evidence is deferred to URI-Memory (NOT_STARTED). Allowed now: session-authoritative selections, session-local reference evidence, structured Change/correction events, rank/display effects from valid session evidence. Not authorized: an ad-hoc durable reference-memory subsystem, or durable learned tie-breaking without URI-Memory qualification."
  - id: "M33.2-AMENDMENTS-G1-G3"
    date: "2026-09-26"
    status: "RECORDED_SUBJECT_TO_REAUDIT"
    decision: "G1: validated deterministic wording may be primary for SIMPLE clarification/confirmation; model wording for EXPLAIN/REASONING; the validator runs on every tier (section 3.1). G2: explicit selection routes substantive work to the selected model; qualified supporting Edge stays permitted; independent dimensions (sections 3 and 6). G3: route preference is not calibration and cannot change thresholds, qualify a failed route, or expand an unqualified role (section 9.1). M33.2 remains CLOSED_VERIFIED; no implementation reopened."

