# URI_STATE.yaml
# Canonical, machine-readable current-state source for URI development governance.
#
# Purpose: remove ambiguity between product milestones, research experiments,
# integration events, reusable components, historical URI generations, and
# current active work, so future agents do not need to infer current
# architecture ownership or milestone status from stale relay documents,
# historical plans, or naming collisions.
#
# This file records CURRENT STATE ONLY. It is not a history log and does not
# replace URI_ACTIVE_MILESTONE.md's narrative closure trail, URI_AGENT_RELAY.md's
# handoff history, or URI_DEVELOPMENT_EVIDENCE_REGISTRY.md's epistemological
# findings record — those remain authoritative for evidence and history. This
# file is the answer to "what is true right now" only.
#
# Update discipline: update this file additively whenever a milestone/
# experiment/integration/component status changes. Do not silently overwrite a
# prior `updated` entry's meaning — if a correction is needed, add a note under
# `corrections`, per this repository's auditable-correction-history convention.
#
# Authority rule (Development Control Layer Normalization, Phase F): this
# file is the canonical current-state authority. URI_ACTIVE_MILESTONE.md,
# URI_AGENT_RELAY.md, and other human-readable files remain historical
# evidence, narrative context, and handoff summaries. Where they conflict
# with this file on what is CURRENT, this file wins, unless a later,
# formally accepted governance artifact explicitly supersedes it.
#
# Development Control Layer Normalization freeze, 2026-09-25: the
# normalization/repair/re-audit cycle for this file and its validator
# (scripts/governance/uri_state_validator.py,
# scripts/governance/uri_state_yaml.py) is CLOSED at verdict
# CONTROL_LAYER_ACCEPTED_WITH_LIMITATIONS, per independent re-audit after
# two bounded repair rounds. Full history, the accepted documented
# limitations, and the freeze record are in
# docs/governance/URI_DEV_CONTROL_LAYER_NORMALIZATION_REPORT.md §19. This
# freeze does not authorize M33.3 implementation, does not create any
# INT-* event, and does not promote any research/component candidate.

